<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Myggdrasil — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* (styles identical to your template) */
  :root{--void:#0D1210;--surface:#161D1A;--surface-raised:#1D2622;--border:rgba(237,233,222,0.1);--border-strong:rgba(237,233,222,0.18);--amber:#E8A33D;--amber-dim:rgba(232,163,61,0.14);--sage:#7FB88F;--sage-dim:rgba(127,184,143,0.14);--rust:#D96B54;--text:#EDE9DE;--text-muted:#8B9490;--radius:16px}
  *{box-sizing:border-box}html,body{margin:0;background:var(--void);color:var(--text);font-family:'Manrope',ui-sans-serif,sans-serif;background-image:radial-gradient(circle at 12% 0%,rgba(232,163,61,0.07),transparent 40%),radial-gradient(circle at 92% 30%,rgba(127,184,143,0.06),transparent 45%)}
  .font-display{font-family:'Fraunces',serif}.font-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(13,18,16,0.88);backdrop-filter:blur(10px)}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:20px}
  .status-pill{display:none;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:6px 12px}
  @media(min-width:720px){.status-pill{display:flex}}.status-dot{width:6px;height:6px;border-radius:999px;background:var(--sage);box-shadow:0 0 0 3px var(--sage-dim)}
  .btn-new{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#2B1D06;font-weight:700;font-size:14px;border:none;border-radius:999px;padding:11px 20px;cursor:pointer}
  main{max-width:1180px;margin:0 auto;padding:48px 32px 120px}.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.04em}.eyebrow::before{content:"// ";opacity:.55}
  h1.page-title{font-family:'Fraunces',serif;font-weight:600;font-size:34px;margin:10px 0 8px}
  .page-sub{color:var(--text-muted);font-size:15px;max-width:46ch;line-height:1.6;margin:0 0 40px}
  .layout{display:grid;grid-template-columns:1fr;gap:32px}@media(min-width:980px){.layout{grid-template-columns:1.5fr 1fr;align-items:start}}
  .trunk-line-bg{position:absolute;top:6px;bottom:6px;left:21px;width:2px;background:var(--border-strong)}
  .nodes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:28px;position:relative}
  .node{position:relative;padding-left:56px}.node-dot{position:absolute;left:12px;top:6px;width:20px;height:20px;border-radius:999px;background:var(--surface);border:2px solid var(--amber);z-index:2}
  .node.is-child .node-dot{border-color:var(--sage)}.node.is-active .node-dot{background:var(--amber);box-shadow:0 0 0 5px var(--amber-dim)}
  .node-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;color:var(--text)}
  .node-card:hover{transform:translateY(-3px);border-color:var(--border-strong)}.node-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px}.node-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:999px;background:var(--amber-dim);color:var(--amber)}.node-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 6px}.node-excerpt{font-size:13.5px;color:var(--text-muted);line-height:1.55;margin:0}
  .branch-hint{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sage)}
  .detail-panel{position:sticky;top:92px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px}
  .detail-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:10px}.detail-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 6px}.detail-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);margin-bottom:18px}.detail-body{font-size:14px;color:var(--text-muted);line-height:1.7;margin-bottom:22px}
  .consequences-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:10px;text-transform:lowercase}
  .consequence-chip{display:flex;align-items:center;gap:8px;background:var(--sage-dim);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .no-consequences{font-size:13px;color:var(--text-muted);font-style:italic;margin-bottom:16px}
  .btn-link{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px dashed var(--border-strong);color:var(--sage);font-weight:600;font-size:13px;border-radius:12px;padding:12px;cursor:pointer;margin-top:14px}
  .fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:999px;background:var(--amber);color:#2B1D06;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .modal-overlay{position:fixed;inset:0;background:rgba(6,9,7,0.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-overlay.open{display:flex}.modal{width:100%;max-width:460px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:22px;padding:28px}.modal-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 4px}.modal-sub{font-size:13px;color:var(--text-muted);margin:0 0 22px}
  .field{margin-bottom:16px}.field label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:7px}.field input,.field select,.field textarea{width:100%;background:var(--void);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-family:'Manrope',sans-serif;font-size:14px}
  .field textarea{resize:vertical;min-height:64px}.modal-actions{display:flex;gap:10px;margin-top:22px}.btn-ghost,.btn-primary{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--border-strong)}.btn-ghost{background:transparent;color:var(--text)}.btn-primary{background:var(--amber);color:#2B1D06;border:none}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.6"><path d="M12 2v20M12 8l-6-4M12 8l6-4M12 14l-7 3M12 14l7 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Myggdrasil
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusCount">— decisões</span></div>
    <div id="authArea"></div>
  </div>
</header>

<main>
  <p class="eyebrow">hub</p>
  <h1 class="page-title">Sua árvore de decisões</h1>
  <p class="page-sub">A linha do tempo completa das suas decisões. Toque em qualquer nó para ver os detalhes e ligar consequências a ele.</p>

  <div class="layout">
    <div class="timeline-wrap">
      <div class="trunk-line-bg"></div>
      <ul class="nodes" id="nodeList"></ul>
    </div>

    <aside class="detail-panel" id="detailPanel"></aside>
  </div>
</main>

<button class="fab" id="fabBtn" aria-label="Nova decisão">+</button>

<!-- Create / Edit modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="modal-title" id="modalTitle">Nova decisão</p>
    <p class="modal-sub">Registre uma decisão ou evento na sua árvore.</p>

    <div class="field">
      <label>Título</label>
      <input id="evTitle" type="text" placeholder="Ex: Comecei a estudar Kubernetes" />
    </div>
    <div class="field">
      <label>Data</label>
      <input id="evWhen" type="date" />
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="evCategory">
        <option value="1">Carreira</option>
        <option value="2">Estudo</option>
        <option value="3">Projeto pessoal</option>
        <option value="4">Financeiro</option>
        <option value="5">Pessoal</option>
      </select>
    </div>
    <div class="field">
      <label>Descrição</label>
      <textarea id="evWhy" placeholder="O que aconteceu e por quê..."></textarea>
    </div>
    <div class="field">
      <label>Vincular como consequência de (opcional)</label>
      <select id="parentSelect"><option value="">Nenhuma — decisão independente</option></select>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="saveEventBtn">Salvar decisão</button>
    </div>
  </div>
</div>

<!-- Login / Signup / Profile modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="modal-title" id="authModalTitle">Entrar</p>
    <p class="modal-sub" id="authModalSub">Acesse sua conta ou crie uma nova.</p>

    <div id="authForms">
      <!-- Login form -->
      <div id="loginForm">
        <div class="field"><label>Nome</label><input id="loginName" type="text" /></div>
        <div class="field"><label>Email</label><input id="loginEmail" type="email" /></div>
        <div class="field"><label>Senha</label><input id="loginPassword" type="password" /></div>
        <div class="modal-actions"><button class="btn-ghost" onclick="closeAuthModal()">Fechar</button><button class="btn-primary" onclick="login()">Entrar</button></div>
      </div>

      <!-- Signup form -->
      <div id="signupForm" style="display:none;">
        <div class="field"><label>Nome</label><input id="signupName" type="text" /></div>
        <div class="field"><label>Email</label><input id="signupEmail" type="email" /></div>
        <div class="field"><label>Senha</label><input id="signupPassword" type="password" placeholder="Senha forte" /></div>
        <div class="field"><label>Data de Nascimento (opcional)</label><input id="signupBirth" type="date" /></div>
        <div class="modal-actions"><button class="btn-ghost" onclick="closeAuthModal()">Fechar</button><button class="btn-primary" onclick="signup()">Criar conta</button></div>
      </div>

      <!-- Profile form -->
      <div id="profileForm" style="display:none;">
        <div class="field"><label>Nome</label><input id="profileName" type="text" /></div>
        <div class="field"><label>Email</label><input id="profileEmail" type="email" /></div>
        <div class="field"><label>Data de Nascimento</label><input id="profileBirth" type="date" /></div>
        <div class="field"><label>Nova senha (opcional)</label><input id="profilePassword" type="password" /></div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeAuthModal()">Cancelar</button>
          <button class="btn-primary" onclick="updateProfile()">Salvar perfil</button>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn-ghost" onclick="logout()">Logout</button>
          <button class="btn-ghost" onclick="showDeleteAccount()" style="color:#f88;border-color:rgba(255,100,100,0.12)">Deletar conta</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  const apiBase = (window.__API_BASE__ || '/api') ;
  // helper to call backend with credentials (cookie auth)
  async function api(path, opts={}){
    const res = await fetch((path.startsWith('http')? path : apiBase + path), {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    })
    if(!res.ok){
      const text = await res.text()
      throw new Error(res.status + ' ' + text)
    }
    return res.json().catch(()=>null)
  }

  let decisions = [];
  let currentUser = null;

  // ---------------- auth / user ----------------
  async function getProfile(){
    try{
      const res = await api('/auth/me');
      currentUser = res.user || null;
    }catch(e){ currentUser = null }
    renderAuthArea();
  }

  function renderAuthArea(){
    const area = document.getElementById('authArea');
    area.innerHTML = '';
    if(currentUser){
      const btn = document.createElement('button');
      btn.className = 'btn-new';
      btn.textContent = currentUser.name || 'Perfil';
      btn.onclick = () => openProfile();
      area.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn-new';
      btn.textContent = 'Entrar';
      btn.onclick = () => openAuthModal('login');
      area.appendChild(btn);
    }
  }

  async function login(){
    const name = document.getElementById('loginName').value;
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try{
      await api('/auth/login', { method: 'POST', body: JSON.stringify({ name, email, password }) });
      closeAuthModal();
      await getProfile();
      await loadEvents();
    }catch(e){ alert('Erro no login: ' + e.message) }
  }

  async function signup(){
    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const birth = document.getElementById('signupBirth').value || undefined;
    try{
      await api('/user/signup', { method: 'POST', body: JSON.stringify({ name, email, password, birth_dt: birth ? new Date(birth).toISOString() : undefined }) });
      alert('Conta criada — por favor verifique seu email (se ativado). Faça login.');
      openAuthModal('login');
    }catch(e){ alert('Erro no cadastro: ' + e.message) }
  }

  async function logout(){
    try{
      await api('/auth/logout', { method: 'POST' });
      currentUser = null;
      renderAuthArea();
      closeAuthModal();
    }catch(e){ alert('Erro ao deslogar: '+e.message) }
  }

  function openProfile(){
    openAuthModal('profile');
    document.getElementById('profileName').value = currentUser?.name || '';
    document.getElementById('profileEmail').value = currentUser?.email || '';
    document.getElementById('profileBirth').value = currentUser?.birth_dt ? new Date(currentUser.birth_dt).toISOString().slice(0,10) : '';
  }

  async function updateProfile(){
    const name = document.getElementById('profileName').value || undefined;
    const email = document.getElementById('profileEmail').value || undefined;
    const birth = document.getElementById('profileBirth').value || undefined;
    const password = document.getElementById('profilePassword').value || undefined;
    try{
      // update name/email/birth
      await api('/user/profile/update', { method: 'PUT', body: JSON.stringify({ name, email, birth_dt: birth ? new Date(birth).toISOString() : undefined }) });
      // password change: backend currently does not expose a password-change endpoint; try a generic route and show message if missing
      if(password){
        try{
          await api('/user/change-password', { method: 'POST', body: JSON.stringify({ password }) });
          alert('Senha atualizada.');
        }catch(err){
          alert('Perfil atualizado. Mudança de senha não suportada pelo backend atual.');
        }
      } else {
        alert('Perfil atualizado.');
      }
      await getProfile();
    }catch(e){ alert('Erro ao atualizar perfil: '+e.message) }
  }

  // ---------------- events ----------------
  async function loadEvents(){
    try{
      const res = await api('/event/event');
      if(Array.isArray(res)) decisions = res;
      else if(res && Array.isArray(res.events)) decisions = res.events;
      else decisions = res || [];
    }catch(e){
      console.warn('Não foi possível carregar eventos do backend, usando dados locais.', e.message);
      // keep existing sample if any
    }
    renderList(decisions.length? decisions[decisions.length-1]?.id : null);
    updateStatusCount();
    populateParentSelect();
  }

  async function createEvent(){
    const name = document.getElementById('evTitle').value;
    const when = document.getElementById('evWhen').value;
    const why = document.getElementById('evWhy').value;
    const event_type = parseInt(document.getElementById('evCategory').value) || 1;
    const parent = document.getElementById('parentSelect').value || null;

    const payload = { name, event_type, when: when ? new Date(when).toISOString() : new Date().toISOString(), why, status: 'active' };
    try{
      const res = await api('/event/event/create', { method: 'POST', body: JSON.stringify(payload) });
      closeModal();
      await loadEvents();
    }catch(e){ alert('Erro ao criar evento: ' + e.message) }
  }

  // ---------------- UI render ----------------
  const listEl = document.getElementById('nodeList');
  const panelEl = document.getElementById('detailPanel');
  const parentSelect = document.getElementById('parentSelect');

  function childrenOf(id){ return decisions.filter(d => d.childOf === id || d.parent === id || d.parent_id === id); }

  function renderList(activeId){
    listEl.innerHTML = decisions.map(d => {
      const id = d.id || d.event_id || d.eventId || d._id;
      const date = (d.when || d.date || d.created_at || '').slice ? (d.when || d.date || '').slice(0,7) : '';
      const title = d.name || d.title || '—';
      const excerpt = d.why || d.excerpt || '';
      const category = (d.event_type && (d.event_type.name || d.event_type)) || d.category || '—';
      const childOf = d.childOf || d.child_of || d.parent || d.parent_id || null;
      const isChild = !!childOf;
      return `
      <li class="node ${isChild? 'is-child' : ''} ${id === activeId ? 'is-active' : ''}">
        <span class="node-dot"></span>
        <button class="node-card" onclick="selectNode(${id})">
          <div class="node-meta">
            <span class="node-date">${date}</span>
            <span class="tag">${category}</span>
          </div>
          <p class="node-title">${escapeHtml(title)}</p>
          <p class="node-excerpt">${escapeHtml(excerpt)}</p>
          ${isChild? `<div class="branch-hint">↳ consequência de "${escapeHtml((decisions.find(p => (p.id||p.event_id)==childOf)||{}).name || '—') }"</div>` : ''}
        </button>
      </li>
    `}).join('');
  }

  function renderPanel(id){
    const d = decisions.find(x => (x.id||x.event_id) === id);
    if(!d){ panelEl.innerHTML = '<p class="detail-eyebrow">Nenhuma decisão selecionada</p><p class="detail-body">Selecione um nó para ver detalhes.</p>'; return }
    const kids = childrenOf(id);
    panelEl.innerHTML = `
      <p class="detail-eyebrow">decisão selecionada</p>
      <p class="detail-title">${escapeHtml(d.name||d.title)}</p>
      <p class="detail-date">${(d.when||d.date||'').slice(0,10)} · ${(d.event_type && d.event_type.name) || d.category || ''}</p>
      <p class="detail-body">${escapeHtml(d.why||d.body||'')}</p>
      <p class="consequences-label">// consequências (${kids.length})</p>
      ${kids.length ? kids.map(k => `
        <div class="consequence-chip">${escapeHtml(k.name||k.title)}</div>
      `).join('') : `<p class="no-consequences">Nenhuma consequência vinculada ainda.</p>`}
      <button class="btn-link" onclick="openModal(${id})">Adicionar consequência</button>
    `;
  }

  function selectNode(id){ renderList(id); renderPanel(id); }

  function openModal(preselectParentId){
    parentSelect.innerHTML = `<option value="">Nenhuma — decisão independente</option>` + decisions.map(d=>`<option value="${d.id||d.event_id}">${escapeHtml(d.name||d.title)}</option>`).join('');
    if(preselectParentId) parentSelect.value = preselectParentId;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

  // auth modal toggles
  function openAuthModal(mode='login'){
    document.getElementById('authModal').classList.add('open');
    document.getElementById('loginForm').style.display = mode==='login'? 'block' : 'none';
    document.getElementById('signupForm').style.display = mode==='signup'? 'block' : 'none';
    document.getElementById('profileForm').style.display = mode==='profile'? 'block' : 'none';
  }
  function closeAuthModal(){ document.getElementById('authModal').classList.remove('open'); }

  function showSignup(){ openAuthModal('signup'); }
  function showLogin(){ openAuthModal('login'); }

  // helper to escape HTML
  function escapeHtml(str){ if(!str) return ''; return String(str).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function updateStatusCount(){ document.getElementById('statusCount').textContent = (decisions.length || 0) + ' decisões'; }

  function populateParentSelect(){ const sel = document.getElementById('parentSelect'); sel.innerHTML = `<option value="">Nenhuma — decisão independente</option>` + decisions.map(d=>`<option value="${d.id||d.event_id}">${escapeHtml(d.name||d.title)}</option>`).join(''); }

  // wire buttons
  document.getElementById('fabBtn').addEventListener('click', ()=> openModal());
  document.getElementById('saveEventBtn').addEventListener('click', createEvent);

  // initial sample data (keeps UI usable even if backend not available)
  decisions = [
    { id: 1, date: '2025-01', name: 'Iniciei ADS na Faculdade Impacta', event_type: {name:'Estudo'}, childOf: null, why: 'Comecei a graduação em Análise e Desenvolvimento de Sistemas.', when: '2025-01-01' },
    { id: 2, date: '2025-08', name: 'Aceitei estágio na fintech', event_type: {name:'Carreira'}, childOf: 1, why: 'Entrei como estagiário de TI focado em backend e automação.', when: '2025-08-01' }
  ];

  // startup
  (async function init(){
    try{ await getProfile(); }catch(e){}
    await loadEvents();
  })();

  // expose some functions to window for inline onclick handlers in template
  window.openModal = openModal; window.closeModal = closeModal; window.selectNode = selectNode; window.openAuthModal = openAuthModal; window.showSignup = showSignup; window.showLogin = showLogin; window.openProfile = openProfile; window.logout = logout; window.closeAuthModal = closeAuthModal;

  // profile delete flow helper (calls existing delete endpoint)
  function showDeleteAccount(){
    const ok = confirm('Deseja realmente deletar sua conta? Essa ação é irreversível. Você precisará confirmar sua senha.');
    if(!ok) return;
    const password = prompt('Digite sua senha para confirmar:');
    if(!password) return alert('Senha necessária');
    api('/user/profile/delete', { method: 'DELETE', body: JSON.stringify({ password }) }).then(()=>{ alert('Conta deletada'); logout(); }).catch(e=>alert('Erro: '+e.message));
  }

</script>

</body>
</html>
